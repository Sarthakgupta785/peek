<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1120">
  <title>Peek · Welcome</title>
  <link rel="icon" type="image/svg+xml" href="/static/icons/peek.svg">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth">
  <main class="login-wrap">
    <div class="login">
      <div class="brand">
        <div class="brand-tile"><img src="/static/icons/peek.svg" alt=""></div>
        <h1 class="wordmark">peek</h1>
        <p class="tagline">Your PC, at a glance.</p>
      </div>

      <section class="login-card welcome-card">
        <h2>Welcome back</h2>
        <p class="hint">Confirm it's you with Google to open your private dashboard.</p>
        <a class="btn primary block" href="/?signin=1">Continue with Google</a>
        <p class="hint welcome-note">Google's next page mentions ngrok, the secure connection Peek uses to reach your PC.</p>
      </section>

      <p class="doc-links"><a href="/about">About</a> · <a href="/privacy">Privacy</a></p>
    </div>
  </main>
</body>
</html>
