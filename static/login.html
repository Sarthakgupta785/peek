<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1120">
  <title>Peek · Sign in</title>
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" type="image/svg+xml" href="/static/icons/peek.svg">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Peek">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth">
  <main class="login-wrap">
    <div class="login">
      <div class="brand">
        <div class="brand-tile"><img src="/static/icons/peek.svg" alt=""></div>
        <h1 class="wordmark">peek</h1>
        <p class="tagline">Your PC, at a glance.</p>
      </div>

      <form id="form" class="login-card" novalidate>
        <label class="field">
          <span>Password</span>
          <input type="password" id="password" autocomplete="current-password" required autofocus>
        </label>
        <label class="field" id="code-field" hidden>
          <span>Authenticator code</span>
          <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="6 digits">
        </label>
        <button class="btn primary block" id="go" type="submit">Sign in</button>
        <div class="msg err" id="msg" role="alert"></div>
      </form>

      <ul class="trust" aria-label="How this dashboard is protected">
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></svg>Private to you</li>
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Two-step sign-in</li>
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>Encrypted</li>
      </ul>
      <p class="doc-links"><a href="/about">About</a> · <a href="/privacy">Privacy</a></p>
    </div>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
